<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ML LAB — Machine Learning, Made Interactive. Learn machine learning algorithms by experimenting with real, in-browser simulations." />
    <meta name="theme-color" content="#0a1224" />
    <title>ML LAB — Machine Learning, Made Interactive</title>
    <script>
      try {
        var th = localStorage.getItem('mllab.theme');
        var lg = localStorage.getItem('mllab.lang');
        if (th === 'light') document.documentElement.classList.remove('dark');
        if (lg === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
